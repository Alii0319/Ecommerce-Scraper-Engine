{{- if and (not .Values.django.existingSecret) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backend-secrets" .Release.Name }}
  labels:
    app: {{ .Release.Name }}-backend
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.django.secretKey | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}