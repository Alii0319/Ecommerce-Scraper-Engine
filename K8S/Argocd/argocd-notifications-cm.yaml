apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Context section: variables available inside notification templates
  context: |
    argocdUrl: "https://192.168.49.2:30570"   

  # Email service configuration: SMTP settings for sending emails
  service.email: |
    username: $email-username
    password: $email-password
    host: smtp.gmail.com              # swap for your SMTP provider's host
    port: 465                         # SSL port
    from: $email-username

  # Email content when app health becomes Degraded
  template.email-health-degraded: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} health is {{.app.status.health.status}}"
    message: |
      🚨 Application: {{.app.metadata.name}}
      📂 Namespace: {{.app.metadata.namespace}}
      🔄 Sync status: {{.app.status.sync.status}}
      📌 Revision: {{.app.status.sync.revision}}
      ❤️ Health status: {{.app.status.health.status}}
      📝 Health message: {{.app.status.health.message}}
      ⚙️ Last operation: {{ if .app.operationState }}{{ .app.operationState.phase }}{{ else }}<none>{{ end }}
      🔗 Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  # Email content when app is successfully deployed (synced + healthy)
  template.email-deployed: |
    email:
      subject: "[ArgoCD] {{.app.metadata.name}} successfully deployed 🎉"
    message: |
      ✅ Application: {{.app.metadata.name}}
      📂 Namespace: {{.app.metadata.namespace}}
      🔄 Sync status: {{.app.status.sync.status}}
      📌 Revision: {{.app.status.sync.revision}}
      ❤️ Health status: {{.app.status.health.status}}
      🔗 Commit Diff: https://github.com/Alii0319/Ecommerce-Scraper-Engine/commit/{{.app.status.sync.revision}}
      🔗 ArgoCD UI: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

# Trigger: fires when app health is Degraded
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [email-health-degraded]

  # Trigger: fires when app is synced and healthy
  trigger.on-deployed: |
    - when: app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
      send: [email-deployed]