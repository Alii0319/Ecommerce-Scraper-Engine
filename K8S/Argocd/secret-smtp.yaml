# secret-smtp.yaml
# Defines a Kubernetes Secret for storing SMTP credentials used by ArgoCD Notifications.
# Do NOT put real values here — this file is a template. See the GitHub Actions
# step below for how the real secret gets created at deploy time.

apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  email-username: "<SMTP_USERNAME>"     # injected from GitHub Actions secret, never committed
  email-password: "<SMTP_APP_PASSWORD>" # injected from GitHub Actions secret, never committed