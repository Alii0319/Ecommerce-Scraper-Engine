x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-testing-key-12345}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,frontend}
  DB_NAME: ${DB_NAME:-scraper_db}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:8080}

services:
  db:
    image: postgres:13-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-scraper_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scraper_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - scraper-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - scraper-network

  migrate:
    image: ali0319/ecom-scraper-backend:v1.0.0
    env_file:
      - .env
    environment: *backend-environment
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - scraper-network

  web:
    image: ali0319/ecom-scraper-backend:v1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-environment
    command: ["sh", "-c", "python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"]
    ports:
      - "8000:8000"
    volumes:
      - static-data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - scraper-network

  celery:
    image: ali0319/ecom-scraper-backend:v1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-environment
    command: ["celery", "-A", "core", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - scraper-network

  celery-beat:
    image: ali0319/ecom-scraper-backend:v1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-environment
    command: ["celery", "-A", "core", "beat", "--loglevel=INFO", "--pidfile="]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - scraper-network

  frontend:
    image: ali0319/ecom-scraper-frontend:v1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - scraper-network

volumes:
  db-data:
  redis-data:
  static-data:

networks:
  scraper-network:
    driver: bridge