name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'K8S/**'
      - '**.md'

env:
  BACKEND_IMAGE: ali0319/ecom-scraper-backend
  FRONTEND_IMAGE: ali0319/ecom-scraper-frontend

jobs:
  # ---------- Backend ----------
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scraper_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DB_NAME: scraper_db
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

  build-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }} -o backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  # ---------- Frontend ----------
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  # ---------- Trivy Security Scan ----------
  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image

      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Scan backend image tar
        uses: aquasecurity/trivy-action@master
        with:
          input: 'backend-image.tar'
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image tar
        uses: aquasecurity/trivy-action@master
        with:
          input: 'frontend-image.tar'
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ---------- Push to Docker Hub ----------
  push:
    runs-on: ubuntu-latest
    needs: [trivy-scan, build-backend, build-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image

      - uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push backend
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.tag }} ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.tag }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Tag and push frontend
        run: |
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ needs.build-frontend.outputs.tag }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ needs.build-frontend.outputs.tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ---------- Update Helm values (GitOps — ArgoCD) ----------
  update-manifest:
    runs-on: ubuntu-latest
    needs: [push, build-backend, build-frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump backend image tag
        run: |
          yq -i '.image.tag = "${{ needs.build-backend.outputs.tag }}"' K8S/Umbrella-chart/charts/backend-chart/values.yaml

      - name: Bump frontend image tag
        run: |
          yq -i '.image.tag = "${{ needs.build-frontend.outputs.tag }}"' K8S/Umbrella-chart/charts/frontend-chart/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8S/Umbrella-chart/charts/backend-chart/values.yaml K8S/Umbrella-chart/charts/frontend-chart/values.yaml
          git diff --cached --quiet || git commit -m "chore: bump image tags to ${{ needs.build-backend.outputs.tag }} [skip ci]"
          git pull --rebase
          git push