name: Ecommerce Scraper Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  production-grade-ci:
    runs-on: ubuntu-latest
    steps:
      # v4 se v5 par upgrade kiya taake Node.js 24 deprecation warning khatam ho sake
      - name: Checkout Code
        uses: actions/checkout@v5

      # GitHub Secret se secure password utha kar temporary .env file banana
      - name: Inject Production Secrets into Env File
        run: |
          echo "DB_USER=postgres" >> .env
          echo "DB_NAME=scraper_db" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          cp .env backend/.env # Django backend workspace ke liye copy[cite: 2]

      # Pure stack (Postgres, Redis, Django, Celery, Celery Beat, React) ko build aur run karna[cite: 2]
      - name: Spin up Full Production Stack with Docker Compose
        run: |
          docker compose up -d --build

      # 30 seconds wait karna takay healthchecks pass ho sakein[cite: 2]
      - name: Verify Multi-Container Architecture Health Status
        run: |
          echo "Waiting for all microservices to pass health checks..."
          sleep 30
          docker compose ps
          
      # Failure ki surat mein logs show karna[cite: 2]
      - name: Print Microservices Logs on Failure
        if: failure()
        run: |
          docker compose logs

      # Test complete hone par stack down karna[cite: 2]
      - name: Tear Down Production Stack
        run: |
          docker compose down -v