name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: |
          cat << 'EOF' > .env
          DJANGO_SECRET_KEY=ci-secret-key-1234567890-test-key-long-enough-for-production
          DJANGO_DEBUG=False
          DB_NAME=scraper_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=db
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/1
          REDIS_HOST=redis
          REDIS_PORT=6379
          ALLOWED_HOSTS=localhost,127.0.0.1,web
          CORS_ALLOWED_ORIGINS=http://localhost
          CSRF_TRUSTED_ORIGINS=http://localhost
          VITE_API_BASE_URL=http://localhost:8000/api/
          VITE_WS_BASE_URL=ws://localhost:8000
          USE_IN_MEMORY_CHANNEL_LAYER=False
          EOF

      - name: Build services
        run: docker compose build

      - name: Run single-owner database migrations
        run: docker compose up -d db redis && docker compose run --rm migrate

      - name: Start backend service
        run: docker compose up -d --wait web celery celery-beat

      - name: Django system checks
        run: docker compose exec -T web python manage.py check

      - name: Check no pending migrations
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Backend tests
        run: docker compose exec -T web python manage.py test

      - name: Django deployment checks
        run: docker compose exec -T web python manage.py check --deploy

      - name: Verify only migrate service ran migrations
        run: |
          echo "=== migrate service logs ==="
          docker compose logs migrate --no-color
          echo "=== web service logs (should have NO migrate lines) ==="
          WEB_LOGS=$(docker compose logs web --no-color)
          echo "$WEB_LOGS"
          if echo "$WEB_LOGS" | grep -q "Applying.*migrations"; then
            echo "FAILURE: web service ran migrations — only migrate service should do this!" >&2
            exit 1
          fi

      - name: Verify health endpoints
        run: |
          docker compose exec -T web python -c "
          import urllib.request
          live = urllib.request.urlopen('http://localhost:8000/api/health/live/', timeout=5)
          ready = urllib.request.urlopen('http://localhost:8000/api/health/ready/', timeout=5)
          assert live.status == 200, f'Liveness check failed: {live.status}'
          assert ready.status == 200, f'Readiness check failed: {ready.status}'
          print('Health checks passed')
          "

      - name: Frontend lint and typecheck
        run: |
          docker run --rm \
            -v "$PWD/frontend:/app" \
            -w /app \
            node:20-alpine \
            sh -c "npm ci && npm run lint && npx tsc --noEmit"

      - name: Frontend build
        run: |
          docker run --rm \
            -v "$PWD/frontend:/app" \
            -w /app \
            node:20-alpine \
            sh -c "npm ci && npm run build"

      - name: Full Compose startup verification
        run: docker compose up -d --wait

      - name: Verify all services are healthy
        run: docker compose ps

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v